<footer class="footer-component" id="contato">
    <div class="footer-component__content">
        <section class="footer-component__brand" aria-label="EnglishUp">
            <span class="footer-component__brand-link">
                <img src="assets/images/logoEnglishUp.png" alt="EnglishUp">
            </span>
            <p>Inglês para abrir<br>novas oportunidades.</p>

            <div class="footer-component__social" aria-label="Redes sociais">
                <span aria-label="Facebook">
                    <fa-icon [icon]="faFacebookF"></fa-icon>
                </span>
                <span aria-label="Instagram">
                    <fa-icon [icon]="faInstagram"></fa-icon>
                </span>
            </div>
        </section>

        <section class="footer-component__column" aria-label="Navegação">
            <h2>Navegação</h2>
            <span>Início</span>
            <span>Cursos</span>
            <span>Sobre</span>
            <span>Depoimentos</span>
            <span>FAQ</span>
            <span>Contato</span>
        </section>

        <section class="footer-component__column" aria-label="Cursos">
            <h2>Cursos</h2>
            <span>Inglês Geral</span>
            <span>Inglês para Viagens</span>
            <span>Inglês para Negócios</span>
            <span>Preparatório</span>
        </section>

        <section class="footer-component__column footer-component__contact" aria-label="Contato">
            <h2>Contato</h2>
            <span>WhatsApp: (11) 99999-9999</span>
            <span>contato@englishup.com.br</span>
            <span>São Paulo - SP</span>
        </section>
    </div>
</footer>
